events {
    worker_connections 1024;
}

http {
    upstream face_api_cluster {
        server api:8000;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://face_api_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            client_max_body_size 50M;
        }
    }
}
